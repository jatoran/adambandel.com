        <p class="n">${i + 1}. ${esc(h.name)}</p>
        <div class="w">${esc(h.area)}${h.address ? " · " + esc(h.address) : ""}</div>
        <div>${U.tag(h.class, "info")}${U.tag(h.ownership_label, "")}${inBudget(h) ? U.tag(h.real ? "in budget, taxes + fees in" : "in budget", "good") : bn(h) != null && bn(h) < H.budget.lo ? U.tag("under budget", "good") : bn(h) != null ? U.tag("over budget", "bad") : ""}${d.status === "verified" ? U.tag("2 dogs confirmed on hotel site", "good") : U.tag("dog policy: confirm by phone", "ok")}${h.rating ? U.tag("★ " + h.rating + (h.reviews ? " (" + U.num(h.reviews) + ")" : ""), "") : ""}</div>
        ${h.real ? `<div class="price"><b>${U.usd(h.real.best)}</b><small>real price for 3 nights, taxes + hotel fees in: ${esc(h.real.best_room)} via ${esc(h.real.best_source)}</small>
          ${h.real_allin_dogs_known ? `<small><b style="font-size:1rem">${U.usd(h.real_allin)}</b> with the dogs</small>` : `<small>dog fee not published, so no dog total</small>`}</div>` : ""}
        <div class="price" style="opacity:.75">${price}${totals}<small>Google lead-in, for comparison</small></div>
        <p class="why">${esc(h.why || "")}</p>
        <div class="dog"><b>🐕 Dogs:</b> ${esc(d.summary || "")}${d.fee_text ? ` <b>Fee:</b> ${esc(d.fee_text)}${d.fee_stay != null ? " (" + U.usd(d.fee_stay) + " for this stay)" : ""}.` : ""}${d.rules ? " " + esc(d.rules) : ""}${h.grass ? ` <b>Nearest grass:</b> ${esc(h.grass)}.` : ""}</div>
        ${h.room ? `<div class="src" style="font-size:.84rem">Entry room: ${esc(h.room)}${h.dest_fee ? " · Destination fee: " + esc(h.dest_fee) : ""}</div>` : (h.dest_fee ? `<div class="src" style="font-size:.84rem">Destination fee: ${esc(h.dest_fee)}</div>` : "")}
        ${(h.flags || []).map(f => `<div class="flag">⚠ ${esc(f)}</div>`).join("")}
        <div class="go">${U.link(h.url, "Hotel site")}${U.link(d.source, "Pet policy")}${U.link(h.rate_url, "Live prices on Google")}</div>
      </div>${roomsBlock(h, h.tier === "pick")}</div>`;
  }

  function render() {
    $("#fl").innerHTML = [["all", "All areas"]].concat(AREAS.map(a => [a.key, a.label])).map(([k, l]) => `<button data-g="area" data-k="${esc(k)}" class="${st.area === k ? "on" : ""}">${esc(l)}</button>`).join("") +
      '<span class="sep"></span>' + BUD.map(([k, l]) => `<button data-g="budget" data-k="${k}" class="${st.budget === k ? "on" : ""}">${esc(l)}</button>`).join("") +
      '<span class="sep"></span>' + SORT.map(([k, l]) => `<button data-g="sort" data-k="${k}" class="${st.sort === k ? "on" : ""}">${esc(l)}</button>`).join("");
    $("#fl").querySelectorAll("button").forEach(b => b.onclick = () => { st[b.dataset.g] = b.dataset.k; render(); U.log("filter", Object.assign({}, st)); });
    let list = (H.list || []).filter(h => (st.area === "all" || h.area_group === st.area) &&
      (st.budget === "all" || inBudget(h) || (st.budget === "under" && bn(h) != null && bn(h) < H.budget.lo)));
    const big = 9e9;
    if (st.sort === "price") list = list.slice().sort((a, b) => (bn(a) == null ? big : bn(a)) - (bn(b) == null ? big : bn(b)));
    else if (st.sort === "allin") list = list.slice().sort((a, b) => (sortKey(a) == null ? big : sortKey(a)) - (sortKey(b) == null ? big : sortKey(b)));
    else list = list.slice().sort((a, b) => a.rank - b.rank);
    $("#cnt").textContent = `${list.length} of ${(H.list || []).length} hotels`;
    $("#list").innerHTML = list.map(card).join("") || '<p class="note">Nothing matches these filters.</p>';
  }
  render();
  $("#expand").onclick = () => document.querySelectorAll("details.rooms").forEach(d => d.open = true);
  $("#collapse").onclick = () => document.querySelectorAll("details.rooms").forEach(d => d.open = false);

  $("#rejNote").textContent = H.rejected_note || "";
  $("#rej tbody").innerHTML = (H.rejected || []).map(r => `<tr><td class="n">${esc(r.name)}<small>${esc(r.area || "")}</small></td><td class="r" data-l="Price">${r.nightly != null ? U.usd(r.nightly) : "-"}</td><td data-l="Why not">${esc(r.reason)}${r.source ? ` <span class="src">${U.link(r.source, "source")}</span>` : ""}</td></tr>`).join("");
  $("#fine").innerHTML = (H.fine_print || []).map(f => `<li>${esc(f)}</li>`).join("");
  $("#foot").textContent = (H.footer || "") + (TRIP.generated ? " Page built " + TRIP.generated.slice(0, 10) + "." : "");
  U.lightbox();
  U.log("startup", {hotels: (H.list || []).length, rejected: (H.rejected || []).length, rates: H.rates_fetched || null});
})();
</script>
</body>
</html>
