<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Oregon &amp; Washington Coast — Trip Plan, July 22–26</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --wed: #7e22ce;
    --thu: #2563eb;
    --fri: #16a34a;
    --sat: #f97316;
    --sun: #dc2626;
    --ink: #1c2230;
    --muted: #5b6577;
    --paper: #f6f7f9;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    min-height: 92vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    color: #fff;
    background: #222 center/cover no-repeat;
    background-image:
      linear-gradient(180deg, rgba(10,12,20,.25) 0%, rgba(10,12,20,.30) 45%, rgba(10,12,20,.85) 100%),
      url("images/multnomah-falls-04.jpg");
  }
  .hero-inner {
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    padding: 0 28px 64px;
  }
  .hero .eyebrow {
    text-transform: uppercase;
    letter-spacing: .22em;
    font-size: 13px;
    font-weight: 600;
    opacity: .9;
    margin-bottom: 14px;
  }
  .hero h1 {
    font-size: clamp(38px, 7vw, 76px);
    line-height: 1.02;
    margin: 0 0 16px;
    font-weight: 800;
    text-shadow: 0 2px 30px rgba(0,0,0,.45);
  }
  .hero p.sub {
    font-size: clamp(16px, 2.4vw, 21px);
    max-width: 640px;
    margin: 0 0 26px;
    opacity: .95;
  }
  .facts { display: flex; flex-wrap: wrap; gap: 10px; }
  .fact {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 8px 15px;
    font-size: 14px;
    font-weight: 500;
  }
  .fact b { font-weight: 700; }
  .scroll-cue {
    position: absolute;
    bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    opacity: .85; animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,7px)} }

  /* ---------- Sticky day nav ---------- */
  .daynav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(246,247,249,.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #e4e7ec;
  }
  .daynav-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; gap: 8px; padding: 11px 18px; overflow-x: auto;
  }
  .daynav a {
    flex: 0 0 auto;
    text-decoration: none;
    font-size: 13px; font-weight: 600;
    color: var(--muted);
    padding: 7px 13px; border-radius: 999px;
    border: 1.5px solid transparent;
    white-space: nowrap;
    transition: all .15s ease;
  }
  .daynav a .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 7px; vertical-align: 1px; background: var(--c);
  }
  .daynav a:hover { color: var(--ink); background: #eceef2; }
  .daynav a.active {
    color: var(--ink); border-color: var(--c);
    background: #fff;
  }

  /* ---------- Layout ---------- */
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 18px 80px; }

  .day {
    --c: var(--wed);
    padding-top: 30px;
  }
  .day-head {
    position: relative;
    margin: 34px 0 8px;
    padding: 26px 26px 22px;
    border-radius: 18px;
    color: #fff;
    overflow: hidden;
    background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 70%, #000 30%));
    box-shadow: 0 14px 34px -16px var(--c);
  }
  .day-head .dow {
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    font-weight: 700; opacity: .9;
  }
  .day-head h2 { margin: 4px 0 6px; font-size: clamp(24px,4vw,34px); font-weight: 800; }
  .day-head .theme { margin: 0; font-size: 15px; opacity: .95; font-style: italic; }

  /* timeline */
  .timeline {
    position: relative;
    margin-left: 13px;
    border-left: 2px solid color-mix(in srgb, var(--c) 35%, #d7dbe2 65%);
    padding: 12px 0 6px;
  }
  .item { position: relative; padding: 0 0 26px 30px; }
  .item::before {
    content: attr(data-n);
    position: absolute; left: -15px; top: 0;
    width: 28px; height: 28px; border-radius: 50%;
    background: #fff; border: 2px solid var(--c); color: var(--c);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .item.place::before { background: var(--c); color: #fff; }

  /* reveal */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* step row */
  .step {
    display: flex; align-items: baseline; gap: 9px;
    color: var(--muted); font-size: 15.5px;
    padding-top: 2px;
  }
  .step .ic { font-size: 16px; }
  .step b { color: var(--ink); font-weight: 650; }

  /* place card */
  .card {
    background: var(--card);
    border: 1px solid #e7eaef;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 18px 40px -28px rgba(20,30,60,.5);
  }
  .gallery {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px; background: #0d1220;
    scroll-snap-type: x mandatory; scrollbar-width: thin;
    scrollbar-color: #475067 #0d1220;
  }
  .gallery img {
    height: 320px; width: auto; flex: 0 0 auto; object-fit: cover;
    border-radius: 10px; cursor: zoom-in; scroll-snap-align: center;
    background: #182033; transition: filter .2s ease;
  }
  .gallery img:hover { filter: brightness(1.07); }
  .gallery-empty { padding: 26px; text-align: center; color: var(--muted); background: #f0f2f5; }
  .swipe-hint { font-size: 12.5px; color: var(--muted); padding: 9px 20px 2px; }
  .swipe-hint b { color: var(--ink); font-weight: 650; }
  .card-body { padding: 14px 20px 19px; }
  @media (max-width: 620px) { .gallery img { height: 220px; } }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--c); background: color-mix(in srgb, var(--c) 12%, #fff 88%);
    border: 1px solid color-mix(in srgb, var(--c) 30%, #fff 70%);
    padding: 3px 9px; border-radius: 999px; margin-bottom: 9px;
  }
  .card-body h3 { margin: 0 0 7px; font-size: 21px; font-weight: 750; }
  .card-body p { margin: 0; color: #39404e; font-size: 15.5px; }
  .flag {
    margin-top: 11px; font-size: 14px;
    background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
    padding: 9px 12px; border-radius: 10px;
  }
  .flag.optional { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }
  .walk {
    margin-top: 9px; font-size: 14px; font-weight: 600;
    background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;
    padding: 8px 12px; border-radius: 10px; line-height: 1.4;
  }
  .walk.hike { background: #fef9c3; border-color: #fde047; color: #854d0e; }

  .daynote {
    margin: 4px 0 0 30px; font-size: 14px; color: var(--muted);
    border-left: 3px solid color-mix(in srgb, var(--c) 50%, #fff 50%);
    padding: 6px 0 6px 12px;
  }

  /* ---------- ideas / alternatives ---------- */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { display: inline-block; transition: transform .2s ease; font-size: 12px; }
  details[open] > summary .chev { transform: rotate(90deg); }

  .ideas { margin: 10px 0 4px 30px; }
  .ideas > summary {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 13.5px; font-weight: 700; color: var(--ink);
    background: #fff;
    border: 1.5px dashed color-mix(in srgb, var(--c) 55%, #c2c8d2 45%);
    padding: 8px 15px; border-radius: 999px;
  }
  .ideas > summary:hover { background: #fbfcfe; }
  .ideas-lead {
    margin: 12px 0 10px; font-size: 13px; color: var(--muted);
    font-style: italic;
  }
  .idea-grid { display: grid; gap: 11px; }
  .idea {
    background: #fbfcfd;
    border: 1.5px dashed #cbd2dd;
    border-left: 4px solid var(--c);
    border-radius: 12px; padding: 12px 15px;
  }
  .idea-gallery {
    display: flex; gap: 6px; overflow-x: auto; margin: 0 0 11px;
    padding-bottom: 4px; scroll-snap-type: x mandatory; scrollbar-width: thin;
    border-radius: 9px;
  }
  .idea-gallery img {
    height: 150px; width: auto; flex: 0 0 auto; object-fit: cover;
    border-radius: 8px; cursor: zoom-in; scroll-snap-align: start;
    background: #e7eaef; transition: filter .15s ease;
  }
  .idea-gallery img:hover { filter: brightness(1.06); }
  .idea h4 { display: inline; margin: 0; font-size: 16px; font-weight: 750; }
  .itag {
    display: inline-block; font-size: 10px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px; margin-right: 9px; vertical-align: 2px;
  }
  .itag.add { background: #dcfce7; color: #15803d; }
  .itag.swap { background: #dbeafe; color: #1d4ed8; }
  .itag.optional { background: #ede9fe; color: #6d28d9; }
  .itag.eat { background: #ffedd5; color: #c2410c; }
  .itag.skip { background: #fee2e2; color: #b91c1c; }
  .itag.note { background: #e2e8f0; color: #334155; }
  .idea .what { margin: 7px 0 0; font-size: 14px; color: #39404e; }
  .idea .meta { margin-top: 9px; display: flex; flex-direction: column; gap: 4px; }
  .idea .dogline { font-size: 13px; color: #3f6212; }
  .idea .routeline { font-size: 13px; color: #344054; font-weight: 650; }

  /* ---------- weather ---------- */
  .weatherbar { max-width: 900px; margin: 24px auto 0; padding: 0 18px; }
  .wx-card {
    background: #fff; border: 1px solid #e7eaef; border-radius: 16px;
    padding: 15px 17px; box-shadow: 0 18px 40px -30px rgba(20,30,60,.5);
  }
  .wx-title { font-weight: 800; font-size: 16px; margin-bottom: 12px; }
  .wx-title span { color: var(--muted); font-weight: 600; font-size: 14px; }
  .wx-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .wx-day {
    border: 1px solid #eef1f5; border-top: 3px solid var(--c);
    border-radius: 12px; padding: 11px 8px 10px; text-align: center; background: #fcfdfe;
  }
  .wx-dow { font-weight: 800; font-size: 12.5px; letter-spacing: .03em; }
  .wx-date { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .wx-icon { font-size: 28px; line-height: 1; margin: 7px 0 5px; }
  .wx-temp { font-weight: 800; font-size: 15.5px; }
  .wx-temp span { color: var(--muted); font-weight: 600; font-size: 13px; }
  .wx-sum { font-size: 11px; color: #51596b; margin-top: 4px; line-height: 1.25; }
  .wx-loc { font-size: 10.5px; font-weight: 700; color: var(--c, #51596b); margin-top: 5px; line-height: 1.2; letter-spacing: .01em; }
  .wx-note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  .day-weather {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.30);
    padding: 5px 13px; border-radius: 999px; font-size: 13.5px; color: #fff;
  }
  .day-weather b { font-weight: 800; }
  .day-weather .wx-i { font-size: 16px; }
  @media (max-width: 620px) {
    .wx-strip { grid-template-columns: repeat(5, minmax(82px, 1fr)); overflow-x: auto; }
  }

  /* ---------- before-you-go notes panel ---------- */
  .notes-wrap { max-width: 900px; margin: 22px auto 0; padding: 0 18px; }
  .notes { }
  .notes > summary {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 800; color: var(--ink);
    padding: 4px 0 12px;
  }
  .notes-card {
    background: #fff; border: 1px solid #e7eaef; border-radius: 16px;
    padding: 6px 20px 10px; box-shadow: 0 18px 40px -30px rgba(20,30,60,.5);
  }
  .note-row { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid #eef1f5; font-size: 14.5px; }
  .note-row:first-child { border-top: none; }
  .note-row .k { font-weight: 750; min-width: 132px; }
  .note-row .v { color: #39404e; }
  @media (max-width: 620px) {
    .note-row { flex-direction: column; gap: 2px; }
    .note-row .k { min-width: 0; }
    .ideas, .daynote { margin-left: 24px; }
  }

  /* footer */
  footer {
    max-width: 900px; margin: 0 auto; padding: 28px 18px 70px;
    color: var(--muted); font-size: 14px; text-align: center;
  }
  footer a { color: var(--thu); font-weight: 600; }
  .closing {
    background: #fff; border: 1px solid #e7eaef; border-radius: 16px;
    padding: 22px 24px; margin: 10px auto 26px; max-width: 640px;
    box-shadow: 0 18px 40px -30px rgba(20,30,60,.5);
  }
  .closing b { color: var(--ink); }

  /* lightbox */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(8,10,16,.9); align-items: center; justify-content: center; padding: 32px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 94vw; max-height: 86vh; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 60px rgba(0,0,0,.6); }
  #lightbox .x { position: absolute; top: 16px; right: 24px; color: #fff; font-size: 36px; cursor: pointer; font-weight: 700; line-height: 1; }
  #lightbox .cap { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: #dfe3ea; font-size: 13px; padding: 0 20px; }

  @media (max-width: 620px) {
    .gallery img { height: 190px; }
    .item { padding-left: 24px; }
    .timeline { margin-left: 10px; }
  }
</style>
</head>

<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Road Trip · July 22–26, 2026</div>
    <h1>Oregon &amp; the<br />Washington Coast</h1>
    <p class="sub">Five days from Portland's waterfalls to Mt. Hood to the wild north coast — scroll down to walk the whole thing, day by day.</p>
    <div class="facts">
      <span class="fact">✈️ <b>Arrive</b> Wed 7/22 · PDX 9:25a</span>
      <span class="fact">✈️ <b>Depart</b> Sun 7/26 · PDX 5:39p</span>
      <span class="fact">🛏️ <b>Portland</b> Wed–Thu</span>

          <div class="step"><span class="ic">${it.ic || '•'}</span><span>${it.text}</span></div>
        </div>`;
      } else {
        const photos = STOP_IMAGES[it.stop] || [];
        const imgs = photos.map(g =>
          `<img src="${esc(g.f)}" alt="${esc(g.t)}" title="${esc(g.t)}" data-cap="${esc(it.name)}" loading="lazy">`
        ).join('');
        const gallery = imgs
          ? `<div class="gallery">${imgs}</div>${photos.length > 1 ? `<div class="swipe-hint">← swipe through <b>${photos.length}</b> photos →</div>` : ''}`
          : '<div class="gallery-empty">No photos for this stop.</div>';
        const flag = it.flag
          ? `<div class="flag${it.flagOptional ? ' optional' : ''}">${it.flag}</div>` : '';
        items += `<div class="item place reveal" data-n="${n}">
          <div class="card">
            ${gallery}
            <div class="card-body">
              <span class="badge">${esc(it.badge)}</span>
              <h3>${esc(it.name)}</h3>
              <p>${it.desc}</p>
              ${it.walk ? `<div class="walk${it.walkHike ? ' hike' : ''}">${it.walkHike ? '🥾' : '🚶'} ${esc(it.walk)}</div>` : ''}
              ${flag}
            </div>
          </div>
        </div>`;
      }
    });

    const note = day.note
      ? `<div class="daynote reveal">📌 ${day.note}</div>` : '';

    sec.innerHTML = `
      <div class="day-head reveal">
        <div class="dow">${day.dow} · ${day.date}</div>
        <h2>${esc(day.title)}</h2>
        <p class="theme">${esc(day.theme)}</p>
        ${weatherHtml(day.key)}
      </div>
      <div class="timeline">${items}${note}</div>
      ${ideasHtml(day.key)}`;
    main.appendChild(sec);
  });

  // ---------- top weather strip ----------
  (function () {
    const days = WEATHER.days || {};
    const colors = Object.fromEntries(trip.map(d => [d.key, d.color]));
    const cells = trip.map(d => d.key).filter(k => days[k]).map(k => {
      const w = days[k];
      return `<div class="wx-day" style="--c:${colors[k]}">
        <div class="wx-dow">${esc(w.dow)}</div>
        <div class="wx-date">${esc(w.date)}</div>
        <div class="wx-icon">${w.icon}</div>
        <div class="wx-temp">${w.high}°<span> / ${w.low}°</span></div>
        <div class="wx-sum">${esc(w.short || w.summary)}</div>
        ${w.loc ? `<div class="wx-loc">📍 ${esc(w.loc)}</div>` : ''}
      </div>`;
    }).join('');
    if (!cells) return;
    const m = WEATHER.meta || {};
    document.getElementById('weatherbar').innerHTML = `
      <div class="wx-card">
        <div class="wx-title">🌤️ Weather <span>— ${esc(m.headline || 'typical for these dates')}</span></div>
        <div class="wx-strip">${cells}</div>
        ${m.note ? `<div class="wx-note">${esc(m.note)}</div>` : ''}
      </div>`;
  })();

  // ---------- before-you-go notes panel ----------
  document.getElementById('tripnotes').innerHTML = `
    <details class="notes" open>
      <summary><span class="chev">▸</span>🧭 Before you go — passes, permits &amp; dog rules</summary>
      <div class="notes-card">
        ${TRIP_NOTES.map(n => `<div class="note-row"><span class="k">${esc(n.k)}</span><span class="v">${esc(n.v)}</span></div>`).join('')}
      </div>
    </details>`;

  // ---------- scroll reveal ----------
  const revObs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revObs.unobserve(e.target); } });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.reveal').forEach(el => revObs.observe(el));

  // ---------- scrollspy nav ----------
  const links = Object.fromEntries([...nav.querySelectorAll('a')].map(a => [a.dataset.key, a]));
  const spy = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        nav.querySelectorAll('a').forEach(a => a.classList.remove('active'));
        links[e.target.id]?.classList.add('active');
      }
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('.day').forEach(s => spy.observe(s));

  // ---------- lightbox ----------
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  const lbCap = lb.querySelector('.cap');
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.tagName === 'IMG' && t.closest('.gallery, .idea-gallery')) {
      lbImg.src = t.src; lbImg.alt = t.alt;
      lbCap.textContent = t.getAttribute('data-cap') || t.alt || '';
      lb.classList.add('open');
    } else if (t === lb || t.classList.contains('x')) {
      lb.classList.remove('open'); lbImg.src = '';
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { lb.classList.remove('open'); lbImg.src = ''; } });
<\/script>

function facts(pairs){
  const rows = pairs.filter(p=>p[1]).map(p=>`<div><span class="k">${esc(p[0])}</span>${esc(p[1])}</div>`).join("");

}
function flightBody(it){
  const segs = (it.segments||[]).map(s=>`

        <div class="end"><div class="time">${fmtTime(s.arrive)}</div><div class="code">${esc(s.to)}</div><div class="city">${esc(s.toCity||"")}</div></div>

      <div class="meta"><span><b>${esc(fmtDate(s.depart))}</b></span>${s.aircraft?`<span>${esc(s.aircraft)}</span>`:""}${s.cabin?`<span>${esc(s.cabin)}</span>`:""}${(s.seats||[]).length?`<span>Seats: ${esc(s.seats.join(", "))}</span>`:""}</div>
    </div>`).join("");
  return segs + (it.notes?`<div class="note">${esc(it.notes)}</div>`:"") + costBlock(it);
}
function lodgingBody(it){
  return facts([
    ["Room", it.room],
    ["Guest", it.guest],
    ["Check-in", fmtDateTime(it.checkIn)],
    ["Check-out", fmtDateTime(it.checkOut)],
    ["Nights", it.nights],
    ["Address", it.address],
    ["Phone", it.phone],
    ["Confirmation", it.confirmation]
  ]) + (it.notes?`<div class="note">${esc(it.notes)}</div>`:"") + costBlock(it);
}
function carBody(it){
  return facts([
    ["Vehicle", it.vehicle],
    ["Class", it.class],
    ["Passengers", it.passengers],
    ["Mileage", it.mileage],
    ["Pick-up", fmtDateTime(it.pickup)],
    ["Drop-off", fmtDateTime(it.dropoff)],
    ["Location", it.location],
    ["Confirmation", it.confirmation]
  ]) + (it.notes?`<div class="note">${esc(it.notes)}</div>`:"") + costBlock(it);
}
function itemCard(it){
  const k = KIND[it.type] || KIND.other;
  let body = it.type==="flight" ? flightBody(it) : it.type==="lodging" ? lodgingBody(it) : it.type==="car" ? carBody(it) :
    (facts([["Confirmation", it.confirmation]]) + (it.notes?`<div class="note">${esc(it.notes)}</div>`:"") + costBlock(it));

function render(){
  const items = D.items||[];
  if(!items.length){ $("#sections").innerHTML = `<div class="empty">No reservations recorded yet. Add them to <code>reservations.json</code> and run <code>scripts/apply_reservations.py</code>.</div>`; return; }
  renderHead();
  // group by type in a stable order
  const order = ["flight","lodging","car","activity","other"];
  const groups = {};
  items.forEach(it=>{ (groups[it.type] = groups[it.type]||[]).push(it); });
  let html = "";
  order.forEach(type=>{
    const list = groups[type]; if(!list) return;
    const k = KIND[type]||KIND.other;
    html += `<section><div class="sec-head"><h2>${k.icon} ${k.label}${list.length>1?"s":""}</h2><span class="count">${list.length}</span></div><div class="cards">${list.map(itemCard).join("")}</div></section>`;
  });
  $("#sections").innerHTML = html;

  const t = D.totals||{};
  const foot = [];

const lb = $("#lb"), lbImg = lb.querySelector("img"), lbCap = lb.querySelector(".cap");
function bindThumbs(){

  });
}
lb.onclick = ()=> lb.classList.remove("on");
document.addEventListener("keydown", e=>{ if(e.key==="Escape") lb.classList.remove("on"); });

render();

g","t":"Cape Disappointment Lighthouse, Washington"},{"f":"images/cape-disappointment-03.jpg","t":"Cape Disappointment State Park - Ilwaco, Washington"},{"f":"images/cape-disappointment-04.jpg","t":"North Head Lighthouse at Twilight, SW Coast, Washington"},{"f":"images/cape-disappointment-05.jpg","t":"Cape Disappointment Lighthouse"},{"f":"images/cape-disappointment-06.jpg","t":"Cape Disappointment Lighthouse (Cape Disappointment State Park, Ilwaco, Washington) - October 30th, 2018"},{"f":"images/cape-disappointment-07.jpg","t":"Cape Disappointment Lighthouse"},{"f":"images/cape-disappointment-08.jpg","t":"Cape Disappointment Lighthouse"}]};

    const map = L.map('map').setView([45.73, -123.05], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const lightboxCaption = lightbox.querySelector('.caption');
    const bounds = [];

    function openLightbox(src, caption) {
      lightboxImg.src = src;
      lightboxImg.alt = caption || '';
      lightboxCaption.textContent = caption || '';
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox || e.target.classList.contains('close')) closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
    document.addEventListener('click', function(e) {
      const t = e.target;
      if (t && t.classList && t.classList.contains('popup-photo')) {
        openLightbox(t.getAttribute('data-full') || t.src, t.getAttribute('title') || t.alt);
      }
    });

    function makeIcon(color, num) {
      return L.divIcon({
        html: `<div style="
          background:${color};
          color:white;
          border:2px solid white;
          box-shadow:0 1px 5px rgba(0,0,0,.45);
          width:24px;
          height:24px;
          border-radius:50%;
          display:flex;
          align-items:center;
          justify-content:center;
          font-weight:700;
          font-size:12px;">${num}</div>`,
        className: '',
        iconSize: [24,24],
        iconAnchor: [12,12]
      });
    }

    function escAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function popupHtml(route, stop, index) {
      const imgs = STOP_IMAGES[stop] || [];
      const grid = imgs.length
        ? imgs.map(img =>
            `<img class="popup-photo" src="${escAttr(img.f)}" alt="${escAttr(img.t)}" title="${escAttr(img.t)}" data-full="${escAttr(img.f)}">`
          ).join('')
        : '<div class="fallback-note">No local photo saved for this stop.</div>';
      const hint = imgs.length > 2 ? `<div class="image-hint">← scroll for ${imgs.length} photos →</div>` : '';
      return `
        <div class="popup-card">
          <div class="popup-title">${index + 1}. ${escAttr(stop)}</div>
          <div class="popup-subtitle"><b>${route.day}</b> — ${route.title}</div>
          <div class="image-grid">${grid}</div>
          ${hint}
          <div class="image-credit">Photos from Flickr (Creative Commons) &amp; Wikimedia Commons, saved locally. Click a photo to enlarge.</div>
        </div>
      `;
    }

    routes.forEach((route, routeIdx) => {
      const waypoints = route.stops.map(stop => {
        const p = places[stop];
        bounds.push([p.lat, p.lng]);
        return L.latLng(p.lat, p.lng);
      });

      route.stops.forEach((stop, i) => {
        const p = places[stop];
        const marker = L.marker([p.lat, p.lng], {
          icon: makeIcon(route.color, i + 1),
          title: `${route.day} — ${stop}`
        }).addTo(map);

        marker.bindPopup(popupHtml(route, stop, i), {
          maxWidth: 900,
          minWidth: 760,
          autoPan: true,
          autoPanPadding: [28, 28]
        });

        if (i === 0 || i === route.stops.length - 1 || route.stops.length <= 4) {
          L.marker([p.lat, p.lng], {
            icon: L.divIcon({
              html: `<span class="stop-label">${route.day}: ${stop}</span>`,
              className: '',
              iconSize: null
            }),
            interactive: false
          }).addTo(map);
        }
      });

      try {
        if (window.L && L.Routing) {
          L.Routing.control({
            waypoints: waypoints,
            router: L.Routing.osrmv1({
              serviceUrl: 'https://router.project-osrm.org/route/v1'
            }),
            routeWhileDragging: false,
            addWaypoints: false,
            draggableWaypoints: false,
            fitSelectedRoutes: false,
            show: routeIdx === 1,
            collapsible: true,
            lineOptions: {
              styles: [
                { color: 'white', opacity: 0.9, weight: 8 },
                { color: route.color, opacity: 0.9, weight: 5 }
              ]
            },
            createMarker: function() { return null; }
          }).addTo(map);
        }
      } catch (err) {
        console.warn('Routing failed for', route.day, '- markers and photos still work.', err);
      }
    });

    map.fitBounds(bounds, { padding: [40, 40] });
  <\/script>
</body>
</html>

</script>

  /* Sticky controls */
  .controls{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);

    <h1>🐾 Hotel Options — Oregon Coast Trip</h1>
    <p>Dog-friendly stays for the two hotel nights of the trip, curated for the brief: <strong>$100–$300/night</strong>, very nice &amp; pretty, good areas, spacious rooms, and an easy <strong>2-small-dog</strong> policy. Prices are <em>estimates</em> for the exact dates — confirm live on the Hotels.com links.</p>

      <span>✨ = unique splurge pick ($300–900)</span>
      <span>🛏 Room types, sizes &amp; photos inside each card</span>
    </div>
  </div>
</header>

    <div class="loc-head">
      <span class="dot"></span>
      <h2>Portland</h2>
      <span class="dates">Wed Jul 22 → Fri Jul 24, 2026 · 2 nights</span>
    </div>
    <p class="loc-sub">Base for the arrival day + the Columbia Gorge waterfall day. You want a walkable, safe, pretty neighborhood (downtown core / West End / waterfront) with room for the pups. Portland's boutique scene is very dog-welcoming — several here charge <strong>no pet fee at all</strong>. The gold-accented ✨ <strong>unique splurge</strong> cards at the end are something special — a Columbia Gorge treehouse, a cliff-top 1921 hotel with its own 208-ft waterfall, and luxury glamping — all sitting right on your Thursday Gorge route.</p>

    <div class="grid" id="grid-portland"></div>

      <div class="tablewrap"><table id="tbl-portland"></table></div>

  </section>

  <section class="loc" id="cannonbeach">
    <div class="loc-head">
      <span class="dot"></span>
      <h2>Cannon Beach</h2>
      <span class="dates">Fri Jul 24 → Sun Jul 26, 2026 · 2 nights</span>
    </div>
    <p class="loc-sub">Base for the two coast days (Haystack Rock, Ecola, Oswald West). Cannon Beach is one of the most dog-friendly towns on the coast — dogs run <strong>off-leash</strong> on the main beach. Peak-summer oceanfront rooms get pricey; the ⚠️ resorts are the prettiest but usually top $300, so they're flagged. The gold-accented ✨ <strong>unique splurge</strong> cards at the end go bigger: a glass-walled Arch Cape oceanfront house, an off-grid glass A-frame in the coast forest, and a Scandinavian sauna cabin in Manzanita.</p>
    <p class="count" id="count-cannonbeach"></p>
    <div class="grid" id="grid-cannonbeach"></div>
    <details class="tbl-toggle"><summary>Show comparison table</summary>
      <div class="tablewrap"><table id="tbl-cannonbeach"></table></div>
    </details>
  </section>

  <footer>
    <div class="note">
      <h4>How to read this &amp; what to verify</h4>
      <ul>
        <li><strong>Prices are estimates</strong> for Jul 22–24 (Portland) and Jul 24–26 (Cannon Beach), based on current/typical 2026 summer rates — rooms aren't bookable this far out. The Hotels.com links are pre-pointed at each property; plug in the dates to see live rates.</li>
        <li><strong>Pet fees &amp; taxes are on top</strong> of the nightly room rate shown. City/lodging tax runs ~15% in Portland and ~10–11% on the coast. A few Portland hotels (The Nines, Hi-Lo) also add a mandatory nightly <em>destination fee</em> — flagged on the card.</li>
        <li><strong>Always book the designated pet room</strong> and re-confirm the 2-dog allowance when you reserve — every property limits dogs to specific rooms, and a couple (Surfsand, Tolovana) exclude their very top oceanfront units from pet stays.</li>
        <li><strong>Room types &amp; sizes</strong> (the "🛏 Room types &amp; sizes" panel on each card) come from each hotel's own site/booking data: square footage, bed setup, view, occupancy, features, and an <em>estimated per-room nightly rate</em>. Where a hotel only allows dogs in certain rooms, the non-pet room types are flagged 🚫. Per-room rates are estimates and step up by tier — the live per-room price for your dates shows on the Hotels.com link.</li>
        <li><strong>✨ Unique splurge stays ($300–900):</strong> the gold-accented cards are the "something special" picks — mostly vacation rentals (treehouse, glamping, oceanfront glass house, off-grid A-frame, design cabin) plus the historic Columbia Gorge Hotel. Their booking buttons go to the property/host (not Hotels.com). For the rentals, <strong>confirm the 2-dog allowance and any minimum-night requirement</strong> when you book — summer minimums can apply and a couple ask a per-stay pet deposit.</li>
        <li>Dog policies were cross-checked against each hotel's own site plus <a href="https://www.bringfido.com/">BringFido</a>. All photos (hotel + room) are saved locally in <code>hotel_images/</code> so this page works offline; the Hotels.com galleries have full, current photo sets.</li>
      </ul>
    </div>
  </footer>

function viewTag(v){
  if(/ocean/i.test(v)) return "🌊 "+v;
  if(/garden/i.test(v)) return "🌿 "+v;
  if(/city|skyline|atrium|corner|interior/i.test(v)) return "🏙 "+v;
  return v;
}
function petFlag(pet){
  if(pet==="n") return '<div class="rflag no">🚫 Not a dog room — pick another type</div>';
  if(pet==="?") return '<div class="rflag ask">🐾 Dogs in designated rooms only — confirm this type</div>';
  return "";
}
function roomRow(r, fallback){
  const t=r[0], s=r[1], b=r[2], v=r[3], z=r[4], f=r[5], pet=r[6], p=r[7], img=r[8];
  const sq = s==="n/a" ? "size n/a" : s+" sq ft";
  return `<div class="roomrow">
    <img class="rimg" src="hotel_images/rooms/${img}" alt="${t}" loading="lazy" data-cap="${t} · ${sq}" onerror="this.onerror=null;this.src='${fallback}'">
    <div class="ri">
      <div class="rt"><span>${t}</span><span class="rprice">${p}<small>/nt est.</small></span></div>
      <div class="rmeta"><span class="sqft">${sq}</span> · ${b} · sleeps ${z}</div>
      <div class="rfeat">${viewTag(v)} — ${f}</div>
      ${petFlag(pet)}
    </div>
  </div>`;
}
function roomsPanel(h){
  const list = ROOMS[h.name];
  if(!list || !list.length) return "";
  const fallback = h.img || ("hotel_images/rooms/"+list[0][8]);
  return `<details class="rooms">
    <summary>🛏 ${list.length} room types &amp; sizes — tap to compare</summary>
    <div class="roomlist">${list.map(r=>roomRow(r, fallback)).join("")}</div>
  </details>`;
}

/* ---- Render -------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const sortSel = $("#sort"), budgetOnly = $("#budgetOnly"), picksOnly = $("#picksOnly");

function inBudget(h){ return !h.splurge && h.lo <= 300; }      // any room option lands in/near $100–300
function midPrice(h){ return (h.lo + h.hi) / 2; }

function rankIcon(h){
  if(h.rank===1) return "⭐ #1 pick";
  if(h.rank===2) return "⭐ #2 pick";
  if(h.rank===3) return "⭐ #3 pick";
  return null;
}

function cardHTML(h){
  const picks = rankIcon(h);
  const ribbon = [];
  if(picks) ribbon.push(`<span class="badge pick">${picks}</span>`);
  if(h.dogFee==="$0") ribbon.push(`<span class="badge good">No pet fee</span>`);
  if(h.warn) ribbon.push(`<span class="badge over">⚠️ Often &gt;$300</span>`);
  if(h.splurge) ribbon.push(`<span class="badge uniq">✨ Unique · $300–900</span>`);

  const thumb = h.img
    ? `<img src="${h.img}" alt="${h.name}" loading="lazy" data-cap="${h.name} — ${h.area}">`
    : `<div class="ph">No photo available offline — see the<br>Hotels.com gallery for current cottage photos</div>`;

  const tags = h.tags.map(t=>`<span class="tag">${t}</span>`).join("");
  const extra = h.extra ? `<div class="fee-note">⚠ ${h.extra}</div>` : "";

  return `<article class="card${h.splurge?' splurge':''}" data-budget="${inBudget(h)?1:0}" data-pick="${h.rank?1:0}" data-mid="${midPrice(h)}">
    <div class="thumb">${thumb}
      <div class="ribbon">${ribbon.join("")}</div>
      <div class="price-tag">${h.price}<small>/night · est. + tax</small></div>
    </div>
    <div class="body">
      <h3>${h.name}</h3>
      <div class="area">📍 ${h.area}</div>
      <div class="tags">${tags}</div>
      <div class="blurb">${h.blurb}</div>
      <div class="row"><span class="k">Room:</span><span class="v">${h.room}</span></div>
      <div class="dogline ${h.warn?'':''}">🐾 <strong>Dogs:</strong> ${h.dogs}</div>
      ${extra}
      ${roomsPanel(h)}
      <div class="cta">
        <a class="btn" href="${h.url}" target="_blank" rel="noopener">View on ${h.bookSite||"Hotels.com"} →</a>
      </div>
      <div class="src">Policy source: ${h.src}</div>
    </div>
  </article>`;
}

function tableHTML(list){
  const head = `<thead><tr>
    <th>Hotel</th><th>Area</th><th>Est. / night</th><th>Pet fee</th><th>2 dogs?</th><th>In budget</th>
  </tr></thead>`;
  const rows = list.map(h=>`<tr>
    <td><a href="${h.url}" target="_blank" rel="noopener">${rankIcon(h)?'⭐ ':''}${h.name}</a></td>
    <td>${h.areaType}</td>
    <td>${h.price}</td>
    <td>${h.dogFee}</td>
    <td>Yes</td>
    <td class="${inBudget(h)?'fit-yes':'fit-no'}">${inBudget(h)?'Yes':'Over'}</td>
  </tr>`).join("");
  return head + `<tbody>${rows}</tbody>`;
}

function sortList(list){
  const v = sortSel.value;
  const arr = list.slice();
  if(v==="lo") arr.sort((a,b)=>a.lo-b.lo || midPrice(a)-midPrice(b));
  else if(v==="hi") arr.sort((a,b)=>b.hi-a.hi || midPrice(b)-midPrice(a));
  else arr.sort((a,b)=>{ // top picks first, then price low->high
    const ra=a.rank||99, rb=b.rank||99;
    return ra-rb || a.lo-b.lo;
  });
  return arr;
}

function render(){
  ["portland","cannonbeach"].forEach(loc=>{
    let list = sortList(HOTELS[loc]);
    if(budgetOnly.checked) list = list.filter(inBudget);
    if(picksOnly.checked)  list = list.filter(h=>h.rank);
    $("#grid-"+loc).innerHTML = list.map(cardHTML).join("") || `<p style="color:#5b6675">No hotels match these filters.</p>`;
    $("#tbl-"+loc).innerHTML = tableHTML(sortList(HOTELS[loc]));
    const total = HOTELS[loc].length;
    $("#count-"+loc).textContent = `Showing ${list.length} of ${total} options`;
  });
  bindThumbs();
}

/* ---- Lightbox ------------------------------------------------------------ */
const lb = $("#lb"), lbImg = lb.querySelector("img"), lbCap = lb.querySelector(".cap");
function bindThumbs(){
  document.querySelectorAll("img[data-cap]").forEach(img=>{
    const open = ()=>{ lbImg.src=img.src; lbCap.textContent=img.dataset.cap||""; lb.classList.add("on"); };

lb.onclick = ()=> lb.classList.remove("on");
document.addEventListener("keydown", e=>{ if(e.key==="Escape") lb.classList.remove("on"); });

sortSel.onchange = render;
budgetOnly.onchange = render;

  return `<div class="agg"><div class="at">${a.t}</div><h4>${a.n}</h4><p>${a.d}</p>
    <a href="${a.u}" target="_blank" rel="noopener">Open ${a.n} →</a></div>`;
}

function tableHTML(list){
  const head = `<thead><tr><th>Company</th><th>SUV class</th><th>Est. 4-day total</th><th>Per day</th><th>On-site at PDX</th><th>Dogs</th></tr></thead>`;
  const rows = list.map(c=>`<tr>
    <td><a href="${c.url}" target="_blank" rel="noopener">${c.n}</a></td>
    <td>${c.cls}</td><td>$${c.lo}–${c.hi}</td><td>${c.day}</td>
    <td>${c.n.startsWith("Turo")?"Meet host":"Yes"}</td>
    <td>OK · return hair-free</td>
  </tr>`).join("");
  return head + `<tbody>${rows}</tbody>`;
}

function sortedCompanies(){
  const v = $("#sort").value;
  const a = COMPANIES.slice();
  a.sort((x,y)=> v==="hi" ? (y.lo-x.lo) : (x.lo-y.lo));
  return a;
}

function render(){
  $("#grid-suvs").innerHTML = MODELS.map(modelCard).join("");
  $("#grid-book").innerHTML = sortedCompanies().map(companyCard).join("");
  $("#aggs").innerHTML = AGGS.map(aggCard).join("");
  $("#tbl").innerHTML = tableHTML(sortedCompanies());
  bindThumbs();
}

const lb = $("#lb"), lbImg = lb.querySelector("img"), lbCap = lb.querySelector(".cap");
function bindThumbs(){
  document.querySelectorAll("img[data-cap]").forEach(img=>{
    img.closest(".thumb").onclick = ()=>{ lbImg.src=img.src; lbCap.textContent=img.dataset.cap||""; lb.classList.add("on"); };
  });
}
lb.onclick = ()=> lb.classList.remove("on");
document.addEventListener("keydown", e=>{ if(e.key==="Escape") lb.classList.remove("on"); });
$("#sort").onchange = render;
render();
<\/script>
</body>
</html>

</script>

  <script>
    (function(){
      const DEFAULT = 'plan';
      const frames = {};
      document.querySelectorAll('iframe.frame').forEach(f => frames[f.dataset.tab] = f);
      const tabs = document.querySelectorAll('.tab');
      const spinner = document.getElementById('spinner');
      const loaded = {};

      function load(tab){
        if(loaded[tab]) return;
        const raw = document.getElementById('tpl-' + tab).textContent;
        frames[tab].srcdoc = raw.split('<\\/script>').join('<' + '/script>');
        loaded[tab] = true;
      }

      function activate(tab){
        if(!frames[tab]) tab = DEFAULT;
        tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        Object.values(frames).forEach(f => f.classList.toggle('active', f.dataset.tab === tab));
        load(tab);
        spinner.style.display = 'none';
        if(history.replaceState) history.replaceState(null, '', '#' + tab);
        else location.hash = tab;
      }

      tabs.forEach(b => b.addEventListener('click', () => activate(b.dataset.tab)));
      window.addEventListener('hashchange', () => activate((location.hash || ('#' + DEFAULT)).slice(1)));
      activate((location.hash || ('#' + DEFAULT)).slice(1));
    })();
  </script>
</body>
